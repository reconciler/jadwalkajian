name: Prune & deploy mingguan (Jumat 15:00 WIB)

# CARA KERJA (migrasi dari Netlify ke GitHub Pages, 29 Sep 2026)
#   Situs sekarang di-host GitHub Pages (source: "GitHub Actions", diaktifkan
#   Amal di Settings -> Pages). Tidak ada lagi batasan kredit/biaya seperti
#   Netlify -- workflow ini tetap jalan mingguan (bukan tiap push) murni untuk
#   menjaga IRAMA PUBLIKASI yang sudah dipilih Amal: jadwal akhir pekan tayang
#   sekali di Jumat sore, bukan berubah-ubah kapan saja sepanjang minggu.
#
#   Push ke `main` TIDAK memicu publikasi apa pun -- GitHub Pages hanya
#   menerbitkan lewat job ini, yang cuma jalan sesuai jadwal cron atau saat
#   di-trigger manual. Anda bebas commit event baru setiap hari; baru tayang
#   di deploy mingguan berikutnya.
#
# JADWAL
#   "0 8 * * 5" = Jumat 08:00 UTC = JUMAT 15:00 WIB, sekali seminggu.
#   Dipilih supaya jadwal akhir pekan sudah tayang sebelum orang
#   merencanakan Sabtu-Ahad. Batas commit Anda: Jumat sebelum jam 3 sore.
#
#   Hati-hati: angka jam di cron adalah UTC. 08:00 UTC masih hari yang sama
#   di WIB, tapi jam >= 17:00 UTC akan mendarat di HARI BERIKUTNYA WIB.
#
#   Catatan keandalan (25 Sep 2026): cron ini pernah telat >5 jam dari
#   jadwalnya (delay dari sisi GitHub, bukan bug workflow). Kalau situs
#   tampak belum ter-update lama setelah Jumat 15:00 WIB, cek tab Actions
#   dulu sebelum menganggap ada yang rusak.
#
# PEMICU MANUAL
#   Kalau ada kajian mendesak yang harus segera tayang, jalankan workflow ini
#   manual: tab Actions -> "Prune & deploy mingguan" -> Run workflow. Gratis
#   (tidak ada lagi biaya kredit) -- boleh dijalankan kapan pun perlu.
#
# PRASYARAT
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   (bukan "Deploy from a branch"). Tidak perlu secret apa pun lagi --
#   NETLIFY_BUILD_HOOK sudah tidak dipakai, boleh dihapus dari repo secrets.

on:
  schedule:
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  prune-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil repo (beserta tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Jalankan pruning
        run: python scripts/prune.py

      - name: Generate HTML statis + JSON-LD untuk SEO
        run: python scripts/build.py

      - name: Commit hasil prune/build bila ada perubahan
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "Tidak ada perubahan dari prune atau build."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prune + build otomatis ($(TZ=Asia/Jakarta date +%Y-%m-%d))"
          git push
          echo "Perubahan di-commit."

      - name: Cek apakah ada yang perlu diterbitkan
        id: cek
        run: |
          # Berkas situs + workflow ini sendiri: mengubah cara publikasi juga
          # harus menerbitkan ulang, kalau tidak perubahannya tidak pernah tayang.
          WATCH="index.html robots.txt sitemap.xml favicon.svg og-image.png .github/workflows/weekly-deploy.yml"
          LAST=$(git rev-parse --verify -q refs/tags/last-deploy || echo "")
          if [ -z "$LAST" ]; then
            echo "Belum pernah deploy lewat workflow ini -- akan menerbitkan."
            echo "perlu=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST" HEAD -- $WATCH; then
            echo "Berkas situs tidak berubah sejak deploy terakhir. Dilewati."
            echo "perlu=false" >> "$GITHUB_OUTPUT"
          else
            N=$(git rev-list --count "$LAST"..HEAD -- $WATCH)
            echo "Ada $N commit yang mengubah berkas situs sejak deploy terakhir."
            git log --oneline "$LAST"..HEAD -- $WATCH
            echo "perlu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan Pages
        if: steps.cek.outputs.perlu == 'true'
        uses: actions/configure-pages@v5

      - name: Siapkan folder situs (_site)
        if: steps.cek.outputs.perlu == 'true'
        run: |
          # HANYA berkas ini yang tayang di situs. CLAUDE.md, AUDIT-HANDOFF-*.md,
          # scripts/ dan .github/ sengaja TIDAK disalin (berkas internal).
          # Menambah aset baru yang dirujuk index.html? Tambahkan ke daftar cp
          # di bawah, kalau tidak situs tayang dengan aset hilang.
          mkdir -p _site
          cp index.html robots.txt sitemap.xml favicon.svg og-image.png _site/
          echo "Isi _site:"
          ls -1 _site
          for f in CLAUDE.md scripts .github; do
            if [ -e "_site/$f" ]; then
              echo "::error::Berkas internal ikut ter-copy ke _site: $f"
              exit 1
            fi
          done

      - name: Upload artifact situs
        if: steps.cek.outputs.perlu == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Terbitkan ke GitHub Pages
        if: steps.cek.outputs.perlu == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tandai commit yang sudah diterbitkan
        if: steps.cek.outputs.perlu == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f last-deploy HEAD
          git push -f origin last-deploy
          echo "Tag last-deploy dipindahkan ke $(git rev-parse --short HEAD)."
