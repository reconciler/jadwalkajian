name: Prune & deploy

# CARA KERJA
#   Situs di-host GitHub Pages (Settings -> Pages -> Source: "GitHub Actions").
#   Publikasi HANYA lewat workflow ini. Sejak 2 Okt 2026 (keputusan Amal) tidak
#   ada lagi jadwal mingguan Jumat; jadwal itu dulu ada karena batas kredit Netlify.
#
# PEMICU
#   1. Push ke `main` yang mengubah berkas situs, scripts/, atau workflow ini.
#   2. Issue dibuka atau diedit oleh `reconciler` (formulir Issue = jalur input event;
#      lihat scripts/ingest.py). Issue dikenali dari ISI formulir, bukan judul. Issue dari
#      akun lain membuat run dilewati.
#   3. Cron pengaman HARIAN 20:17 UTC (= 03:17 WIB; disetujui Amal 2 Okt 2026):
#      menerbitkan bila `last-deploy` tertinggal dari main, memproses Issue yang
#      terlewat, menutup Issue yang sudah terbit. Selain itu tidak mengubah apa pun.
#      Cron GitHub bisa telat berjam-jam (25 Sep: 5 jam 34 menit); itu hanya
#      menunda terbit, bukan menghilangkan data.
#   4. Manual: tab Actions -> "Prune & deploy" -> Run workflow (gratis, kapan saja).
#
# INGEST ISSUE (satu run = ingest + komit + deploy + uji + tutup Issue)
#   Tiap run mengambil SEMUA Issue terbuka milik `reconciler` lewat API
#   (ingest.py menyaring yang berisi formulir) (bukan dari payload event), jadi tidak ada Issue yang
#   hilang walau run lain dibatalkan antrean. Isi Issue dibaca dari berkas JSON;
#   TIDAK PERNAH diinterpolasi ke `run:` (injeksi skrip). Issue ditutup hanya setelah
#   uji situs live lolos. Gagal validasi: Issue tetap terbuka + komentar alasan;
#   edit Issue untuk memproses ulang.
#   Push oleh bot (GITHUB_TOKEN) tidak memicu run lain, maka ingest dan deploy harus
#   satu run. Bila push ke main ditolak (ada push lain), run mereset ke origin/main
#   dan mengulang ingest (id dihitung ulang), sampai 4 kali. Satu run = SATU komit bot (data, hasil prune/build,
#   dan templat formulir Issue; B1, 3 Okt 2026).
#
# PRUNE
#   prune.py + build.py jalan di tiap run (kecuali cron tanpa Issue baru), jadi event
#   lewat terhapus dari index.html dan blok statis/JSON-LD pada setiap terbit.
#   Di browser pengunjung event lewat tetap disembunyikan oleh isEventPast()/up().
#
# PRASYARAT
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   (bukan "Deploy from a branch"). Tidak perlu secret apa pun.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - robots.txt
      - sitemap.xml
      - favicon.svg
      - og-image.png
      - scripts/**
      - .github/workflows/deploy.yml
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  prune-and-deploy:
    # Issue dari akun lain / berjudul lain: dilewati tanpa membalas.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'reconciler' &&
       github.event.sender.login == 'reconciler')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil repo (beserta tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Uji logika skrip (hanya push yang mengubah kode)
        # Q13 (3 Okt 2026). HANYA event push, dan hanya bila push mengubah scripts/ atau workflow ini. TIDAK pada issues,
        # schedule, workflow_dispatch: bila uji ikut memblokir input Issue atau cron, satu uji merah menjatuhkan semua input.
        # Push yang hanya mengubah data event (index.html dari flyer manual) tidak diblokir uji kode. Uji integritas data
        # hanya berupa peringatan (di dalam test_ingest.py). Uji memakai data beku (scripts/fixtures) dan jam terkunci.
        if: github.event_name == 'push'
        timeout-minutes: 10
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SEBELUM: ${{ github.event.before }}
        run: |
          set -eu
          if [ -n "$SEBELUM" ] && git cat-file -e "${SEBELUM}^{commit}" 2>/dev/null; then
            UBAH=$(git diff --name-only "$SEBELUM" "$GITHUB_SHA" -- scripts .github/workflows/deploy.yml)
            if [ -z "$UBAH" ]; then
              echo "Push ini tidak mengubah kode (scripts/ atau deploy.yml); uji logika dilewati."
              exit 0
            fi
            echo "Berkas kode yang berubah:"
            echo "$UBAH"
          else
            echo "Pembanding push tidak tersedia (push pertama/force-push); menjalankan uji logika."
          fi
          python scripts/test_ingest.py
          # Uji bekerja di folder sementara. Bila ada berkas repo yang berubah, pulihkan supaya tidak ikut ter-commit.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Uji logika mengubah berkas repo; dipulihkan."
            git status --porcelain
            git checkout -- .
            git clean -fdq
          fi

      - name: Ambil Issue "Tambah kajian" yang terbuka
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', creator: 'reconciler', per_page: 100 });
            const out = issues
              .filter(i => !i.pull_request)
              .map(i => ({ number: i.number, title: i.title, body: i.body || '', login: i.user.login }));
            fs.writeFileSync(process.env.RUNNER_TEMP + '/issues.json', JSON.stringify(out));
            core.info('Issue terbuka yang cocok: ' + out.length);

      - name: Ingest Issue, prune, build, dan komit
        id: pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          EDITED_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OK=0
          for ATTEMPT in 1 2 3 4; do
            echo "== Percobaan $ATTEMPT =="
            python scripts/ingest.py --issues "$RUNNER_TEMP/issues.json" \
              --out "$RUNNER_TEMP/ingest.json" --commit-msg "$RUNNER_TEMP/commit-msg.txt" \
              ${EDITED_ISSUE:+--edited "$EDITED_ISSUE"}
            CHANGED_INGEST=$(git status --porcelain index.html data/kategori.json)
            # Cron atau Issue tanpa perubahan data: jangan prune/build supaya tidak ada commit/deploy sia-sia.
            if { [ "$EVENT_NAME" != "schedule" ] && [ "$EVENT_NAME" != "issues" ]; } || [ -n "$CHANGED_INGEST" ]; then
              python scripts/prune.py
              python scripts/build.py
            fi
            # B1 (3 Okt 2026): SATU komit per run memuat data, hasil prune/build, dan templat formulir Issue
            # (templat ditulis ingest.py dari data/kategori.json). Token pernah terbukti boleh mem-push
            # .github/ISSUE_TEMPLATE (komit f338bdf).
            CHANGED_ALL=$(git status --porcelain index.html data/kategori.json .github/ISSUE_TEMPLATE)
            if [ -z "$CHANGED_ALL" ]; then
              echo "Tidak ada perubahan data."
              OK=1; break
            fi
            CHANGED_TPL=$(git status --porcelain .github/ISSUE_TEMPLATE)
            git add index.html data/kategori.json .github/ISSUE_TEMPLATE
            PESAN="$RUNNER_TEMP/pesan-komit.txt"
            if [ -n "$CHANGED_INGEST" ] && [ -s "$RUNNER_TEMP/commit-msg.txt" ]; then
              cp "$RUNNER_TEMP/commit-msg.txt" "$PESAN"
            else
              echo "Prune + build otomatis ($(TZ=Asia/Jakarta date +%Y-%m-%d))" > "$PESAN"
            fi
            if [ -n "$CHANGED_TPL" ]; then
              printf '\nTemplat formulir Issue diperbarui dari data/kategori.json.\n' >> "$PESAN"
            fi
            git commit -F "$PESAN"
            if git push origin HEAD:main; then
              echo "Perubahan di-commit."
              OK=1; break
            fi
            echo "Push ditolak (main berubah). Sinkron ke origin/main dan ulangi ingest."
            git fetch origin main
            git reset --hard origin/main
          done
          if [ "$OK" != 1 ]; then
            echo "::error::Gagal memuat data ke main setelah 4 percobaan."
            exit 1
          fi

      - name: Cek apakah ada yang perlu diterbitkan
        id: cek
        run: |
          # Berkas situs + workflow ini sendiri: mengubah cara publikasi juga
          # harus menerbitkan ulang, kalau tidak perubahannya tidak pernah tayang.
          WATCH="index.html robots.txt sitemap.xml favicon.svg og-image.png .github/workflows/deploy.yml"
          LAST=$(git rev-parse --verify -q refs/tags/last-deploy || echo "")
          if [ -z "$LAST" ]; then
            echo "Belum pernah deploy lewat workflow ini -- akan menerbitkan."
            echo "perlu=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST" HEAD -- $WATCH; then
            echo "Berkas situs tidak berubah sejak deploy terakhir. Dilewati."
            echo "perlu=false" >> "$GITHUB_OUTPUT"
          else
            N=$(git rev-list --count "$LAST"..HEAD -- $WATCH)
            echo "Ada $N commit yang mengubah berkas situs sejak deploy terakhir."
            git log --oneline "$LAST"..HEAD -- $WATCH
            echo "perlu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan Pages
        if: steps.cek.outputs.perlu == 'true'
        uses: actions/configure-pages@v5

      - name: Siapkan folder situs (_site)
        if: steps.cek.outputs.perlu == 'true'
        run: |
          # HANYA berkas ini yang tayang di situs. CLAUDE.md, AUDIT-HANDOFF-*.md,
          # scripts/ dan .github/ sengaja TIDAK disalin (berkas internal).
          # Menambah aset baru yang dirujuk index.html? Tambahkan ke daftar cp
          # di bawah, kalau tidak situs tayang dengan aset hilang.
          mkdir -p _site
          cp index.html robots.txt sitemap.xml favicon.svg og-image.png _site/
          echo "Isi _site:"
          ls -1 _site
          for f in CLAUDE.md scripts .github data docs; do
            if [ -e "_site/$f" ]; then
              echo "::error::Berkas internal ikut ter-copy ke _site: $f"
              exit 1
            fi
          done

      - name: Upload artifact situs
        if: steps.cek.outputs.perlu == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Terbitkan ke GitHub Pages
        if: steps.cek.outputs.perlu == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Uji situs live setelah terbit
        id: live
        if: steps.cek.outputs.perlu == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
        run: |
          # Memeriksa URL publik dari runner (sesi lokal tidak bisa mengakses github.io).
          # Gagal bila ada cek yang tidak terpenuhi; JANGAN dilonggarkan supaya hijau,
          # selidiki penyebabnya. Bila gagal, tag last-deploy tidak dipindah (langkah
          # berikutnya tidak jalan), jadi run berikutnya menerbitkan ulang.
          # Tidak menilai tampilan (tinggi header, font, tata letak).
          if [ -z "$PAGE_URL" ]; then
            echo "::error::page_url kosong; tidak bisa menguji situs live."
            exit 1
          fi
          BASE="${PAGE_URL%/}/"
          MARKER="Jadwal Kajian"
          INTERNAL="CLAUDE.md AUDIT-HANDOFF-2026-09-30.md scripts/prune.py data/kategori.json docs/formulir-issue.md docs/riwayat-migrasi.md"
          http_code() {
            curl -s -o "$2" -w '%{http_code}' --max-time 15 "${BASE}$1?v=${SHA}" || true
          }
          check_once() {
            local fail=0 code f
            code=$(http_code "" /tmp/home.html)
            if [ "$code" != "200" ]; then echo "  beranda: HTTP $code (harus 200)"; fail=1; fi
            if ! grep -q "$MARKER" /tmp/home.html 2>/dev/null; then
              echo "  beranda: teks penanda \"$MARKER\" tidak ada"; fail=1
            fi
            for f in $(cd _site && find . -maxdepth 1 -type f -printf '%f\n' | sort); do
              code=$(http_code "$f" /dev/null)
              if [ "$code" != "200" ]; then echo "  $f: HTTP $code (harus 200)"; fail=1; fi
            done
            for f in $INTERNAL; do
              code=$(http_code "$f" /dev/null)
              if [ "$code" != "404" ]; then echo "  $f: HTTP $code (harus 404, berkas internal)"; fail=1; fi
            done
            return $fail
          }
          for i in $(seq 1 12); do
            echo "Percobaan $i/12 terhadap $BASE"
            if check_once; then
              echo "Semua cek situs live lulus."
              exit 0
            fi
            if [ "$i" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::Uji situs live gagal setelah 12 percobaan (lihat cek yang gagal di atas)."
          exit 1

      - name: Tandai commit yang sudah diterbitkan
        if: steps.cek.outputs.perlu == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f last-deploy HEAD
          # Run #7 (3 Okt 2026): push tag ditolak GitHub ("fatal error in commit_refs") padahal situs
          # sudah terbit; run berikutnya berhasil dengan perintah yang sama. Ulangi sampai 3 kali
          # dengan jeda; bila tetap gagal, langkah ini merah seperti sebelumnya (tidak disembunyikan).
          for TRY in 1 2 3; do
            if git push -f origin last-deploy; then
              echo "Tag last-deploy dipindahkan ke $(git rev-parse --short HEAD) (percobaan $TRY)."
              exit 0
            fi
            echo "Push tag last-deploy gagal pada percobaan $TRY/3."
            if [ "$TRY" -lt 3 ]; then sleep $((TRY * 10)); fi
          done
          echo "::error::Push tag last-deploy gagal setelah 3 percobaan. Situs sudah terbit; run berikutnya akan menerbitkan ulang."
          exit 1

      - name: Komentar hasil dan tutup Issue
        if: ${{ always() && steps.pipeline.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          PERLU: ${{ steps.cek.outputs.perlu }}
          LIVE: ${{ steps.live.outcome }}
        with:
          script: |
            const fs = require('fs');
            const hasil = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ingest.json', 'utf8')).hasil;
            // Terbit = tidak ada yang perlu diterbitkan, atau deploy + uji situs live lolos.
            const terbit = process.env.PERLU === 'false' || process.env.LIVE === 'success';
            const { owner, repo } = context.repo;
            const tunggu = ms => new Promise(r => setTimeout(r, ms));
            let galatApi = 0;
            // Satu galat API (Issue dikunci/dihapus, batas laju, gangguan sesaat) TIDAK boleh menghentikan komentar/penutupan
            // Issue lain: catatan "gagal" sudah ter-commit, jadi komentar yang terlewat tidak akan dikirim ulang.
            // Coba sampai 3 kali; 404/410 (Issue hilang) tidak diulang. Gagal permanen = peringatan, lanjut.
            const coba = async (label, fn) => {
              for (let i = 1; i <= 3; i++) {
                try { await fn(); return true; }
                catch (e) {
                  core.warning(`${label}: percobaan ${i}/3 gagal (${e.status || ''} ${e.message})`);
                  if ([404, 410].includes(e.status)) break;
                  if (i < 3) await tunggu(i * 2000);
                }
              }
              galatApi++;
              return false;
            };
            const komentar = (n, body) => coba(`komentar Issue #${n}`,
              () => github.rest.issues.createComment({ owner, repo, issue_number: n, body }));
            const tutup = n => coba(`tutup Issue #${n}`,
              () => github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' }));
            const dilaporkan = new Set();
            for (const h of hasil) {
              dilaporkan.add(h.issue);
              if (h.status === 'gagal' || h.status === 'abaikan') { await komentar(h.issue, h.komentar); continue; }  // gagal: tetap terbuka; abaikan: diedit setelah diproses
              if (terbit) {
                // Issue baru ditutup bila komentar hasilnya terkirim; bila tidak, run berikutnya menutupnya lewat penyapu.
                if (await komentar(h.issue, h.komentar)) await tutup(h.issue);
              } else { await komentar(h.issue, h.komentar_tertunda); }                          // tetap terbuka
            }
            // Sapu: Issue terbuka yang sudah diproses di run sebelumnya tetapi belum sempat ditutup.
            if (terbit) {
              try {
                const kat = JSON.parse(fs.readFileSync('data/kategori.json', 'utf8'));
                const diproses = new Set(kat.diproses.map(d => d.issue));
                const terbuka = await github.paginate(github.rest.issues.listForRepo,
                  { owner, repo, state: 'open', creator: 'reconciler', per_page: 100 });
                for (const i of terbuka) {
                  if (i.pull_request || dilaporkan.has(i.number) || !diproses.has(i.number)) continue;
                  if (await komentar(i.number, 'Isi Issue ini sudah tayang di situs. Issue ditutup otomatis.')) await tutup(i.number);
                }
              } catch (e) {
                core.warning(`penyapu Issue dilewati: ${e.message}`);
              }
            }
            if (galatApi) core.warning(`${galatApi} panggilan API komentar/penutupan Issue gagal permanen; lihat peringatan di atas.`);

      - name: Komentar di Issue bila run gagal
        # Tanpa ini Issue tetap terbuka tanpa kabar bila run mati sebelum sempat berkomentar.
        if: ${{ failure() && github.event_name == 'issues' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
            if (issue.state !== 'open') return;  // sudah ditutup = sudah terbit
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ owner, repo, issue_number: n,
              body: `Run workflow untuk Issue ini **gagal** sebelum selesai (${run}). Issue tetap terbuka, artinya **belum terbit**. ` +
                    'Run berikutnya (push atau cron harian sekitar 03:17 WIB) akan mencoba lagi; Anda juga bisa menjalankannya dari tab Actions.' });
