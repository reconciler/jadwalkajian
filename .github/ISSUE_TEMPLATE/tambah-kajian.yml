# DIBUAT OTOMATIS oleh scripts/ingest.py dari data/kategori.json. Jangan edit manual:
# perubahan akan tertimpa pada run berikutnya. Label kolom = kunci parser
# (scripts/adapter_issue_form.py); jangan diubah tanpa mengubah parser.
name: Tambah kajian
description: Tambah satu atau beberapa kajian ke Jadwal Kajian (hanya pemilik repo).
title: "Tambah kajian: "
body:
  - type: input
    id: tanggal
    attributes:
      label: "Tanggal"
      description: "Satu isian. Contoh: 10 Okt 2026 | 10, 17, 24 Okt 2026 | 3-31 Okt 2026 Sabtu | 3-31 Okt 2026 setiap Sabtu kecuali 17 Okt | 3 Okt - 4 Okt 2026 | 10/10/2026. Banyak tanggal = banyak event dengan isian yang sama (maksimum 60 per Issue). Satu Issue = satu jam dan satu masjid: waktu atau masjid berbeda per hari = Issue terpisah. Tidak didukung: tiap 2 minggu, pekan ke-N, bulanan (tulis daftar tanggalnya). Tahun boleh dihilangkan. Cek hasilnya di komentar balasan."
      placeholder: "10 Okt 2026"
    validations:
      required: true
  - type: dropdown
    id: jenis_waktu
    attributes:
      label: "Jenis waktu"
      options:
        - "Jam eksak"
        - "Dhuha"
        - "Ba'da Subuh"
        - "Ba'da Zuhur"
        - "Ba'da Ashar"
        - "Ba'da Maghrib"
    validations:
      required: true
  - type: input
    id: jam
    attributes:
      label: "Jam"
      description: "Hanya bila Jenis waktu = Jam eksak. Contoh 09.30 atau 09.30-11.00."
      placeholder: "09.30-11.00"
    validations:
      required: false
  - type: input
    id: judul
    attributes:
      label: "Judul"
    validations:
      required: true
  - type: dropdown
    id: pemateri
    attributes:
      label: "Pemateri"
