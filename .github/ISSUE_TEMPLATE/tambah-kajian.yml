# DIBUAT OTOMATIS oleh scripts/ingest.py dari data/kategori.json. Jangan edit manual:
# perubahan akan tertimpa pada run berikutnya. Label kolom = kunci parser
# (scripts/adapter_issue_form.py); jangan diubah tanpa mengubah parser.
name: Tambah kajian
description: Tambah satu atau beberapa kajian ke Jadwal Kajian (hanya pemilik repo).
title: "Tambah kajian: "
body:
  - type: textarea
    id: tanggal
    attributes:
      label: "Tanggal"
      description: "Satu tanggal per baris, format YYYY-MM-DD. Banyak tanggal = banyak event dengan isian yang sama."
      placeholder: "2026-10-10\n2026-10-11"
    validations:
      required: true
  - type: dropdown
    id: jenis_waktu
    attributes:
      label: "Jenis waktu"
      options:
        - "Jam eksak"
        - "Dhuha"
        - "Ba'da Subuh"
        - "Ba'da Zuhur"
        - "Ba'da Ashar"
        - "Ba'da Maghrib"
    validations:
      required: true
  - type: input
    id: jam
    attributes:
      label: "Jam"
      description: "Hanya bila Jenis waktu = Jam eksak. Contoh 09.30 atau 09.30-11.00."
      placeholder: "09.30-11.00"
    validations:
      required: false
  - type: input
    id: judul
    attributes:
      label: "Judul"
    validations:
      required: true
  - type: dropdown
    id: pemateri
