# DIBUAT OTOMATIS oleh scripts/ingest.py dari data/kategori.json. Jangan edit manual.
# Label kolom = kunci parser (scripts/adapter_koreksi_form.py); jangan diubah tanpa mengubah parser.
name: Koreksi atau hapus kajian
description: Koreksi atau hapus kajian yang sudah terbit (hanya pemilik repo).
title: "Koreksi kajian: "
body:
  - type: dropdown
    id: aksi
    attributes:
      label: "Aksi"
      description: "Koreksi = ubah kolom yang Anda isi di bawah. Hapus = hilangkan event dari situs."
      options:
        - "Koreksi"
        - "Hapus"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: "Target"
      description: "Event yang dituju: #12 (semua event yang masih ada dari Issue 12), id event (747), atau rentang id (747-750). Boleh digabung dengan koma. Id event ada di komentar Issue 'Tambah kajian'. Semua-atau-tidak-sama-sekali."
      placeholder: "#12"
    validations:
      required: true
  - type: input
    id: konfirmasi
    attributes:
      label: "Konfirmasi (diisi setelah pratinjau)"
      description: "KOSONGKAN saat pertama kali mengirim. Sistem membalas dengan pratinjau (daftar event yang akan dihapus atau diubah). Bila sudah benar, edit Issue ini dan isi kolom ini dengan HAPUS <jumlah> atau KOREKSI <jumlah> sesuai pratinjau, mis. HAPUS 4."
    validations:
      required: false
  - type: input
    id: judul
    attributes:
      label: "Judul (koreksi)"
      description: "Kosong = tidak diubah."
    validations:
      required: false
  - type: input
    id: tanggal
    attributes:
      label: "Tanggal (koreksi)"
      description: "Satu tanggal baru, mis. 10 Okt 2026. Hanya bila Target satu event. Kosong = tidak diubah."
    validations:
      required: false
  - type: dropdown
    id: jenis_waktu
    attributes:
      label: "Jenis waktu (koreksi)"
      description: "Mengubah waktu: pilih jenisnya (dan isi Jam bila Jam eksak)."
      options:
        - "(tidak diubah)"
        - "Jam eksak"
        - "Dhuha"
        - "Ba'da Subuh"
        - "Ba'da Zuhur"
        - "Ba'da Ashar"
        - "Ba'da Maghrib"
      default: 0
    validations:
      required: false
  - type: input
    id: jam
    attributes:
      label: "Jam (koreksi)"
      description: "09.30 atau 09.30-11.00. Hanya untuk Jam eksak (boleh diisi sendiri bila event sudah memakai jam eksak)."
    validations:
      required: false
