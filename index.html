  .btn{background:transparent;border:1px solid #2a3a50;color:#8899bb;padding:7px 14px;border-radius:3px;cursor:pointer;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.04em;transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .btn:hover{border-color:#5a7a9a;color:#ccd8e8}
  .btn.on{background:#e8e3d8;border-color:#e8e3d8;color:#0d1117;font-weight:500}
  .btn.bogor{background:#5c4a2d;border-color:#d4a55a;color:#f0d4a8}
  .btn.depok{background:#2d4a5c;border-color:#5a9fd4;color:#c0dff5}
  .btn.jakarta{background:#2a1e4a;border-color:#b07ad4;color:#dcc0f5}
  .btn.bekasi{background:#5c2a1e;border-color:#d4705a;color:#f5b8a8}
  .btn.jawa{background:#1e5c3a;border-color:#5ad49a;color:#a8f5cc}
  .btn.jawabarat{background:#5c1e35;border-color:#d45a8a;color:#f5b8d4}
  .btn.online{background:#2d2d5c;border-color:#8a8ad4;color:#c8c8f5}
  .card{border:1px solid #1e2c40;border-radius:4px;background:#0f1520;margin-bottom:9px;cursor:pointer;transition:border-color .12s;overflow:hidden}
  .card:hover,.card.open{border-color:#2e4560}
  .card.rutin-card{border-style:dashed;border-color:#2a4a2a}
  .card-body{padding:13px 14px;display:flex;gap:11px}
  .card-time{min-width:90px;flex-shrink:0}
  .card-divider{width:1px;background:#1e2c40;flex-shrink:0}
  .card-content{flex:1;min-width:0}
  .card-title-row{display:flex;justify-content:space-between;gap:6px}
  .card-title{font-family:'Libre Baskerville',serif;font-size:15px;font-weight:700;color:#d8e0ec;line-height:1.3;margin-bottom:3px}
  .card-ustadz{font-size:12px;color:#9aaabf;margin-bottom:4px}
  .card-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .area-tag{font-size:11px;padding:2px 8px;border-radius:2px;display:inline-flex;align-items:center;gap:4px}
  .masjid-tag{font-size:11px;color:#7a9cc0}
  .card-time-label{font-family:'Libre Baskerville',serif;font-size:12px;color:#8898b8;line-height:1.4}
  .card-date{font-family:'Libre Baskerville',serif;font-size:13px;font-weight:700;color:#d8e0ec;line-height:1.3;margin-bottom:2px}
  .rutin-label{font-size:10px;color:#6aaa7a;letter-spacing:.1em;margin-bottom:2px}
  .chevron{color:#5a7a9a;font-size:13px;flex-shrink:0;user-select:none}
  .detail{border-top:1px solid #1e2c40;background:#080d16;padding:13px 16px 13px 110px;display:none}
  .detail.open{display:block}
  .dl{display:grid;grid-template-columns:80px 1fr;gap:7px 0;font-size:13px}
  .dt{color:#7a8eaa;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
  .dd{color:#a8b8cc;line-height:1.5}.dd.note{color:#c89050}
  .row{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;flex-wrap:nowrap}
  .row::-webkit-scrollbar{height:2px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-sm{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}
  .header{background:#070c10;border-bottom:1px solid #1e2c40;padding:20px 16px 16px;position:sticky;top:0;z-index:10}
  .header-sub{font-size:11px;color:#7a9abb;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
  .header-title{font-family:'Libre Baskerville',serif;font-size:26px;font-weight:700;color:#e8e3d8}
  .archive-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 13px;background:#3a3020;border:1px solid #6a5838;border-radius:4px;color:#c9ad78;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.03em;transition:all .12s}
  .archive-link:hover{background:#4a3d28;border-color:#8a7548;color:#e0c896}
  .header-meta{font-size:12px;color:#7a8eaa;margin-top:3px}
  .filters{padding:12px 16px 0}
  .filter-row{display:flex;gap:5px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .filter-label{font-size:11px;color:#7a9abb;letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
  .empty{color:#8898b0;text-align:center;padding:32px 0;font-size:14px}
  .empty a{color:#5a9fd4;cursor:pointer;text-decoration:underline}
  .legend{margin-top:16px;border-top:1px solid #1e2c40;padding-top:10px;display:flex;gap:12px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#7a8eaa}
  .legend-note{font-size:11px;color:#6a7e98;margin-left:auto}
  #cards-container{padding:0 16px 16px}
  @media(max-width:480px){.detail{padding:12px}.dl{grid-template-columns:70px 1fr}}
  .page-footer{border-top:1px solid #1e2c40;margin-top:4px}
  .submit-bar{background:#0a1020;padding:14px 16px;border-bottom:1px solid #1e2c40}
  .submit-title{font-size:11px;color:#7a9abb;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
  .submit-body{font-size:13px;color:#a8b8cc;line-height:1.7}
  .submit-body a{color:#b07ad4;text-decoration:none}
  .submit-body a:hover{text-decoration:underline}
  .meta-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:11px 16px;font-size:11px;color:#6a7e98;background:#070c10}
  .meta-left{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .update-stamp{color:#6a7e98}
  .credit{color:#5a6a7a}
  .credit a{color:#7a8aaa;text-decoration:none}
  .credit a:hover{color:#b07ad4}
</style>

let state={area:"ALL",masjid:"ALL",date:"ALL",expanded:null};
function getTodayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function isEventPast(e){const t=getTodayStr();if(e.date<t)return true;if(e.date>t)return false;return e.timeOrder<new Date().getHours()-0.5;}
function ms(m){return m.replace("Masjid ","").replace("Jami' ","").replace("Jami ","");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function jse(s){return esc(s).replace(/'/g,"\\'");}
function up(){return allEvents.filter(e=>!isEventPast(e));}
function fi(){return up().filter(e=>state.area==="ALL"||e.area===state.area).filter(e=>state.masjid==="ALL"||e.masjid===state.masjid).filter(e=>state.date==="ALL"||e.date===state.date).sort((a,b)=>a.date!==b.date?a.date.localeCompare(b.date):a.timeOrder-b.timeOrder);}
function render(){
  const u=up(),f=fi();
  const MN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const ud=u.map(e=>e.date).sort();
  if(ud.length){const a=ud[0].split("-"),b=ud[ud.length-1].split("-");
    const s=MN[+a[1]-1]+" "+a[0],t=MN[+b[1]-1]+" "+b[0],rng=(s===t)?s:s+" – "+t;
    document.getElementById("header-sub").textContent="Jabodetabek & Sekitarnya · "+rng;
    document.title="Jadwal Kajian · "+rng;}
  document.getElementById("header-meta").textContent=`${u.filter(e=>!e.isRutin).length} event · ${u.filter(e=>e.isRutin).length} rutin · ${[...new Set(u.map(e=>e.masjid))].length} masjid`;
  const areasPresent=new Set(u.map(e=>e.area));
  if(state.area!=="ALL"&&!areasPresent.has(state.area)){state.area="ALL";state.masjid="ALL";state.date="ALL";}
  ["ALL","Depok","Bogor","Jakarta","Bekasi","Jawa Tengah","Jawa Barat","Online"].forEach(a=>{const b=document.getElementById("btn-area-"+a);if(!b)return;b.style.display=(a==="ALL"||areasPresent.has(a))?"":"none";b.className="btn"+(state.area===a?(a==="ALL"?" on":" "+(a==="Jawa Tengah"?"jawa":a==="Jawa Barat"?"jawabarat":a.toLowerCase())):"");});
  const ap=u.filter(e=>state.area==="ALL"||e.area===state.area);
  document.getElementById("masjid-row").innerHTML=`<button class="btn${state.masjid==="ALL"?" on":""}" onclick="setMasjid('ALL')">Semua Masjid</button>`+[...new Set(ap.map(e=>e.masjid))].sort().map(m=>{const c=AC[ap.find(e=>e.masjid===m)?.area]?.dot||"#8899bb";return`<button class="btn${state.masjid===m?" on":""}" onclick="setMasjid('${jse(m)}')">`+`<span class="dot" style="background:${c}"></span>${esc(ms(m))}</button>`;}).join("");
  const mp=ap.filter(e=>state.masjid==="ALL"||e.masjid===state.masjid);
  document.getElementById("date-row").innerHTML=`<button class="btn${state.date==="ALL"?" on":""}" onclick="setDate('ALL')">Semua (${f.length})</button>`+[...new Set(mp.map(e=>e.date))].sort().map(d=>{const ev=allEvents.find(e=>e.date===d);return`<button class="btn${state.date===d?" on":""}" onclick="setDate('${d}')">${esc(ev?.dayShort||d)} (${mp.filter(e=>e.date===d).length})</button>`;}).join("");
  const c=document.getElementById("cards-container");
  if(!f.length){c.innerHTML=`<div class="empty">Tidak ada kajian. <a onclick="resetFilters()">Reset filter</a></div>`+leg();return;}
  c.innerHTML=f.map(e=>{const col=AC[e.area]||AC.Depok,o=state.expanded===e.id;return`<div class="card${o?" open":""}${e.isRutin?" rutin-card":""}" onclick="toggleCard(${e.id})"><div class="card-body"><div class="card-time">${e.isRutin?`<div class="rutin-label">RUTIN</div>`:""}<div class="card-date">${esc(e.dayShort)}</div><div class="card-time-label">${esc(e.timeLabel)}</div></div><div class="card-divider"></div><div class="card-content"><div class="card-title-row"><div><div class="card-title">${esc(e.title)}</div><div class="card-ustadz">${esc(e.ustadz)}</div><div class="card-tags"><span class="area-tag" style="background:${col.badge};color:${col.accent}"><span class="dot-sm" style="background:${col.accent}"></span>${esc(e.area)}</span><span class="masjid-tag">${esc(e.masjid)}</span></div></div><span class="chevron">${o?"▲":"▼"}</span></div></div></div><div class="detail${o?" open":""}"><div class="dl"><div class="dt">Tanggal</div><div class="dd">${esc(e.dayShort)} · ${esc(e.timeLabel)}</div><div class="dt">Masjid</div><div class="dd">${esc(e.masjid)}</div><div class="dt">Alamat</div><div class="dd">${esc(e.address)}</div><div class="dt">Peserta</div><div class="dd">${esc(e.audience)}</div>${e.note?`<div class="dt">Catatan</div><div class="dd note">${esc(e.note)}</div>`:""}</div></div></div>`;}).join("")+leg();
}
function leg(){return`<div class="legend">${Object.entries(AC).map(([a,c])=>`<div class="legend-item"><span class="dot" style="background:${c.dot}"></span>${a}</div>`).join("")}<div class="legend-note">Past events auto-hidden</div></div>`;}
function setArea(a){state.area=a;state.masjid="ALL";state.date="ALL";render();}
function setMasjid(m){state.masjid=(state.masjid===m?"ALL":m);state.date="ALL";render();}
function setDate(d){state.date=(state.date===d?"ALL":d);render();}
function resetFilters(){state.area="ALL";state.masjid="ALL";state.date="ALL";render();}
function toggleCard(id){state.expanded=(state.expanded===id?null:id);render();}
render();
</script>
